workflows:
  ios-unsigned-ipa:
    name: iOS unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Packages
        script: flutter pub get
      # flutter_dotenv throws EmptyEnvFileError on an empty file, which
      # kills main() before runApp and leaves the white splash on screen.
      - name: Create .env
        script: echo "API_BASE_URL=${API_BASE_URL:-https://moneytime.findosystem.com/v1}" > .env
      - name: Pods
        script: |
          cd ios
          pod install
      - name: Build unsigned
        script: flutter build ios --release --no-codesign
      - name: Create IPA
        script: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r app.ipa Payload
    artifacts:
      - app.ipa